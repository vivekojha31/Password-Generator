<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/fontawesome.min.css" integrity="sha512-SMQ1DwSGiIDyNoXdQae7kUBADdtQa8Xsb3LxBxzAXExZNCCH/36yQSpZSYo1c6ckFshd1iMp9eD9+s9+tdhmyg==" crossorigin="anonymous" referrerpolicy="no-referrer"> -->
</head>
<body>
    <div class="container">
        <h1 class="title">Password Generator</h1>
<p class="subtitle">Create a strong & secure password</p>

        <div>
            <h1 id="newPass"></h1>
       <!-- <i class="fa-solid fa-copy" id="copy"></i> -->

        </div>
        
        <div>
            <input type="range" name="" id="range" min="6" max="20" value="8">
        <p id="rangeVal"></p>
        </div>

        <div>
            <input type="checkbox" name="caplet" id="caplet">
            <label for="caplet">Uppercase</label>
            <br>
            <input type="checkbox" name="smalet" id="smalet">
            <label for="smalet">Lowercase</label>
            <br>
            <input type="checkbox" name="number" id="number">
            <label for="number">Number</label>
            <br>
            <input type="checkbox" name="symbol" id="symbol">
            <label for="symbol">Symbol </label>
        </div>

        <button id="genPass">Generate Password</button>
    </div>

    <script src="index.js"></script>
</body>
</html>
